services:
  - type: web
    name: gmail-login-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run server
    disk:
      name: gmail-login-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
